name: continuity-ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: continuity-ci-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - run: python -m unittest discover -s tests -v
      - run: python continuity.py validate
      - run: python continuity_validate_json.py --root .
      - run: python continuity_integrity.py --audit-all --root .
