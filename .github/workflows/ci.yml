name: continuity-ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: continuity-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python continuity.py validate
      - run: python continuity_validate_json.py --root .
      - run: python continuity_integrity.py --audit-all --root .
