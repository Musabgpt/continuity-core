name: continuity-ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: continuity-ci-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.8"
      - run: python -m unittest discover -s tests -v
      - run: python continuity.py validate
      - run: python continuity_validate_json.py --root .
      - run: python continuity_integrity.py --audit-all --root .
